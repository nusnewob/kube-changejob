name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Use a v-prefixed version with an optional prerelease suffix"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$GITHUB_REF_NAME"
            echo "version_no_v=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: Azure/setup-helm@v5.1.0

      - name: Generate release manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make build-installer IMG="$REGISTRY/${IMAGE_NAME,,}:$VERSION"
          bin/kustomize build config/crd > dist/crds.yaml

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version_no_v }}
        run: |
          helm lint --strict dist/chart
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=release-image
            type=gha,scope=ci-image
          cache-to: type=gha,scope=release-image,mode=max,ignore-error=true

      - name: Push Helm chart to GHCR
        env:
          VERSION: ${{ steps.version.outputs.version_no_v }}
        run: |
          helm push "dist/kube-changejob-$VERSION.tgz" "oci://$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/charts" \
            --registry-config "$HOME/.docker/config.json"

      - name: Write release installation notes
        run: |
          # Save to file
          cat > dist/CHANGELOG.md << EOF
          ## Installation

          ### Using kubectl

          \`\`\`bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/install.yaml
          \`\`\`

          ### Using Helm

          \`\`\`bash
          helm install kube-changejob oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/kube-changejob --version ${{ steps.version.outputs.version_no_v }}
          \`\`\`

          ### Install CRDs only

          \`\`\`bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/crds.yaml
          \`\`\`

          ## Container Images

          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`

          ## Helm Chart

          - \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/kube-changejob:${{ steps.version.outputs.version_no_v }}\`

          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/CHANGELOG.md
          files: |
            dist/install.yaml
            dist/crds.yaml
            dist/kube-changejob-${{ steps.version.outputs.version_no_v }}.tgz
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

  update-docs:
    needs: build-and-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update Helm chart version
        env:
          VERSION: ${{ needs.build-and-release.outputs.version_no_v }}
        run: |
          sed -i "s/^version:.*/version: $VERSION/" dist/chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" dist/chart/Chart.yaml

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -vv --no-exec
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "chore(release): update CHANGELOG.md and Helm Chart for release ${{ needs.build-and-release.outputs.version }}"
          file_pattern: "CHANGELOG.md dist/chart/Chart.yaml"
          commit_options: --signoff
